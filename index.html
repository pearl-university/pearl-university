<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Title & Meta -->
    <title>Pearl University | Building Value through Excellence, Innovation & Research</title>
    <meta
      name="title"
      content="Pearl University | Building Value through Excellence, Innovation & Research"
    />
    <meta
      name="description"
      content="Pearl University is a premier higher education institution dedicated to academic depth, innovative research, and leadership across Computing, Health Sciences, Management, and Social Sciences."
    />
    <meta
      name="keywords"
      content="Pearl University, higher education, university in Nigeria, computing science, software engineering, cybersecurity, public health, hospital management, accounting and finance, Calabar university, undergraduate programmes, research institution"
    />
    <meta name="author" content="Pearl University" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://pearluniversity.edu.ng/" />

    <!-- Brand Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="shortcut icon" href="/logo.svg" />

    <!-- Theme & App Colors -->
    <meta name="theme-color" content="#200441" />
    <meta name="msapplication-TileColor" content="#200441" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pearl Uni" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pearl University" />
    <meta property="og:url" content="https://pearluniversity.edu.ng/" />
    <meta
      property="og:title"
      content="Pearl University | Building Value through Excellence, Innovation & Research"
    />
    <meta
      property="og:description"
      content="Empowering future leaders through world-class academic programmes, pioneering research, and transformative campus experience."
    />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:image:alt" content="Pearl University Crest Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pearl_uni" />
    <meta name="twitter:creator" content="@pearl_uni" />
    <meta property="twitter:url" content="https://pearluniversity.edu.ng/" />
    <meta
      name="twitter:title"
      content="Pearl University | Building Value through Excellence, Innovation & Research"
    />
    <meta
      name="twitter:description"
      content="Empowering future leaders through world-class academic programmes, pioneering research, and transformative campus experience."
    />
    <meta name="twitter:image" content="/logo.svg" />
    <meta name="twitter:image:alt" content="Pearl University Crest Logo" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollegeOrUniversity",
        "name": "Pearl University",
        "alternateName": "Pearl Uni",
        "url": "https://pearluniversity.edu.ng",
        "logo": "https://pearluniversity.edu.ng/logo.svg",
        "slogan": "Building Value",
        "description": "Pearl University is a premier higher education institution dedicated to academic excellence, innovative research, and leadership development across Computing, Health Sciences, Management, and Social Sciences.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "100 Murtala Muhammed Highway",
          "addressLocality": "Calabar",
          "addressRegion": "Cross River State",
          "addressCountry": "NG"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Admissions & Inquiries",
          "email": "info@pearluniversity.edu.ng"
        },
        "sameAs": [
          "https://www.instagram.com/pearl_university",
          "https://www.linkedin.com/school/pearl-university"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
